name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: pip install -r requirements-api.txt pytest httpx
      - run: pytest -q   # ONNX parity test needs torch: run locally (see README)

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-api .
      - name: Smoke test (health endpoint, no API key needed)
        run: |
          docker run -d --name rag -p 8000:8000 -e GROQ_API_KEY=dummy rag-api
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs rag; exit 1
